# Publicación automática: cada cambio subido a una rama de trabajo (claude/**) se une a main,
# que es la rama que sirve el sitio. Así cualquier cambio, por pequeño que sea, queda publicado.
name: Publicar en main
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
concurrency:
  group: publicar-main
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unir la rama a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Publicar ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push origin main
